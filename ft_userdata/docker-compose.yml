---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    # GPU támogatáshoz (FreqAI):
    # image: freqtradeorg/freqtrade:stable_freqaitorch
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      # FreqUI elérhető: http://localhost:8080
      - "127.0.0.1:8080:8080"
    # Környezeti változók érzékeny adatokhoz (.env fájlból)
    env_file:
      - .env
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy BBRsiAdxStrategy

  # --- Második stratégia (példa) ---
