  # --- SuperTrendMacdRsiStrategy (1H SuperTrend+MACD+RSI) ---
  # FreqUI: http://localhost:8082 | VPS: https://freqtrade-st.kebodev.hu
  freqtrade_st:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade_st
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
