---
services:
  # --- BBRsiAdxStrategy (1H BB+RSI+ADX) ---
  # FreqUI: http://localhost:8080 | VPS: https://freqtrade.kebodev.hu
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy BBRsiAdxStrategy

  # --- RangeBreakoutPullbackStrategy (5m Kitörés+Visszazárás) ---
  # FreqUI: http://localhost:8081 | VPS: https://freqtrade-rb.kebodev.hu
  # Caddy konfig szükséges: freqtrade-rb.kebodev.hu { reverse_proxy localhost:8081 }
  # A két bot a FreqUI bot-selectorban egyszerre kezelhető.
  freqtrade_rb:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade_rb
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_rb.log
      --db-url sqlite:////freqtrade/user_data/tradesv3-rb.sqlite
      --config /freqtrade/user_data/config_rb.json
      --strategy RangeBreakoutPullbackStrategy
