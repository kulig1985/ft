---
services:
  # --- BBRsiAdxStrategy (1H BB+RSI+ADX) ---
  # FreqUI: http://localhost:8080 | VPS: https://freqtrade.kebodev.hu
  freqtrade_bb:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade_bb
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./user_data/strategies/bb_rsi_adx/.env
    command: >
      trade
      --logfile /freqtrade/user_data/strategies/bb_rsi_adx/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/strategies/bb_rsi_adx/tradesv3.sqlite
      --config /freqtrade/user_data/strategies/bb_rsi_adx/config.json
      --strategy-path /freqtrade/user_data/strategies/bb_rsi_adx
      --strategy BBRsiAdxStrategy

